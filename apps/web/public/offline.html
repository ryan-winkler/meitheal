<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Meitheal</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #19382d; background: #f7f6f1 }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box }
      main { width: min(100%, 420px); padding: 32px; box-sizing: border-box; border: 1px solid #ced8d2; border-radius: 16px; background: #fff }
      .brand { display: flex; align-items: center; gap: 12px; color: #07573d; font-weight: 700; letter-spacing: -.04em; font-size: 24px }
      h1 { margin: 28px 0 12px; font-size: 26px; letter-spacing: -.025em }
      p { line-height: 1.6; color: #465f54 }
      a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 8px; background: #07573d; color: #fff; font-weight: 600; text-decoration: none }
      a:focus-visible { outline: 3px solid #c48810; outline-offset: 4px }
      small { display: block; margin-top: 24px; line-height: 1.5; color: #52675e }
      @media (prefers-color-scheme: dark) {
        :root { color: #e7f0ea; background: #11241c }
        main { background: #193127; border-color: #3e5a4c }
        .brand, p, small { color: #c0d8ca }
        a { background: #a4dac0; color: #11241c }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
          <rect width="64" height="64" rx="13" fill="#10231b"></rect>
          <path d="M15 41V25m0 6c0-5 3-8 7-8s7 3 7 8v10m0-10c0-5 3-8 7-8s7 3 7 8v10" fill="none" stroke="#edf5ef" stroke-linecap="round" stroke-width="5"></path>
          <circle cx="52" cy="40" r="3.5" fill="#69e3b2"></circle>
        </svg>
        meitheal
      </div>
      <h1>You're offline</h1>
      <p>Reconnect to check access and sync changes saved on this device.</p>
      <a href="">Try again</a>
      <small>Keep this tab open while a save is unconfirmed.</small>
    </main>
  </body>
</html>
