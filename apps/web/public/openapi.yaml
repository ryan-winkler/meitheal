        - Search
      summary: Universal search across tasks, views, settings, and actions
      description: The primary search endpoint for all Meitheal content. Supports scoped search (tasks, views, settings,
        actions), field selection, and sorting. Use scope=tasks for task-specific searches, or scope=all for universal
        discovery.
      parameters:
