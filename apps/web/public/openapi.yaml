  /api/search:
    get:
      operationId: searchMeitheal
      tags:
        - Search
      summary: Universal search across tasks, views, settings, and actions
      description: The primary search endpoint for all Meitheal content. Supports scoped search (tasks, views, settings,
        actions), field selection, and sorting. Use scope=tasks for task-specific searches, or scope=all for universal
        discovery.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query text
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - all
              - tasks
              - views
              - settings
              - actions
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            default: 8
            maximum: 12
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - updated
            default: relevance
        - name: include_completed
          in: query
          schema:
            type: boolean
        - name: include_archived
          in: query
          schema:
            type: boolean
        - name: status
          in: query
          schema:
            type: string
        - name: assigned_to
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: integer
        - name: task_fields
          in: query
          schema:
            type: string
          description: "Comma-separated: id,title,description,labels,custom_fields,comments"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "500": *a17
