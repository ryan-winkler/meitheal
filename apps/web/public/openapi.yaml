        - Strategy
      summary: List strategic rules
      description: Strategic lenses and advisory AI context. These rules do not enforce agent mutation permissions.
      responses:
        "200":
          description: Rules
    post:
      operationId: createRule
      tags:
        - Strategy
      summary: Create a strategic rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRule"
      responses:
        "201":
          description: Created
    put:
      operationId: replaceRules
      tags:
        - Strategy
      summary: Atomically replace strategic rules
      description: Validates all rules before one transaction. Omit replaceIds for an explicit full replacement; provide IDs
        to replace only editor-owned defaults and preserve custom rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rules
              properties:
                rules:
                  type: array
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/TaskRule"
                replaceIds:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
                    maxLength: 128
              additionalProperties: false
      responses:
        "200":
          description: Replacement committed
        "400": *a18
        "500": *a17
  /api/rules/{id}:
    put:
      operationId: updateRule
      tags:
        - Automation
      summary: Update a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteRule
      tags:
        - Automation
      summary: Delete a rule
