        "413":
          description: The request body exceeds 32 KiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: The request body must be application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/tasks/{id}/comments/{commentId}:
    get:
