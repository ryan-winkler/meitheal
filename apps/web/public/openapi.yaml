openapi: 3.1.0
info:
  title: Meitheal Hub API
  version: 0.2.35
  description: >-
    Meitheal is a Home Assistant-native household and homelab execution hub. This API powers task management, strategic
    planning, habits, calendar sync, agent orchestration, and automation integrations. All endpoints accept and return
    JSON unless noted otherwise.


    **For AI agents**: Use operationId values as tool names. Prefer searchMeitheal for discovery, createTask/updateTask
    for mutations. Check getHealth before starting workflows.
  contact:
    name: Ryan Winkler
    url: https://github.com/ryan-winkler/meitheal
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: ./
    description: Meitheal App origin relative to this document
  - url: http://localhost:4321
    description: Development server
components:
  schemas:
    TaskComment:
      type: object
      required:
        - id
        - task_id
        - content
        - author
        - created_at
      properties:
        id:
          type: integer
        task_id:
          type: string
        content:
          type: string
        author:
          type: string
          description: Display author recorded when the comment was added.
        created_at:
          type: string
          description: SQLite UTC timestamp.
      additionalProperties: false
    TaskCommentListItem:
      allOf:
        - $ref: "#/components/schemas/TaskComment"
        - type: object
          required:
            - can_manage
          properties:
            can_manage:
              type: boolean
              description: Whether the caller can edit and delete this comment.
          additionalProperties: false
    FeedbackSubmission:
      type: object
      properties:
        submissionId:
          type: string
          format: uuid
          description: Client-generated UUIDv4. Reuse it for identical retries.
        category: &a1
          type: string
          enum:
            - problem
            - accessibility
            - suggestion
            - other
        message: &a2
          type: string
          minLength: 1
          maxLength: 4096
          description: Plain text, at most 4 KiB in UTF-8.
        appVersion: &a3
          type: string
          description: App version, when the sender chose to include it.
        routeFamily: &a4
          type: string
          enum:
            - home
            - tasks
            - calendar
            - settings
            - other
      required:
        - submissionId
        - category
        - message
      additionalProperties: false
    FeedbackReceipt:
      type: object
      properties:
        id: &a5
          type: string
          format: uuid
        receivedAt: &a6
          type: integer
          description: Epoch milliseconds.
      required:
        - id
        - receivedAt
      additionalProperties: false
    FeedbackExport:
      type: object
      properties:
        category: *a1
        message: *a2
        appVersion:
          anyOf:
            - *a3
            - type: "null"
        routeFamily:
          anyOf:
            - *a4
            - type: "null"
      required:
        - category
        - message
        - appVersion
        - routeFamily
      additionalProperties: false
    FeedbackReport:
      type: object
      properties:
        id: *a5
        receivedAt: *a6
        category: *a1
        message: *a2
        appVersion:
          anyOf:
            - *a3
            - type: "null"
        routeFamily:
          anyOf:
            - *a4
            - type: "null"
        state: &a9
          type: string
          enum:
            - open
            - in_progress
            - resolved
            - declined
        submitterId:
          type: string
        claimedBy:
          type:
            - string
            - "null"
        closedBy:
          type:
            - string
            - "null"
        disposition:
          type:
            - string
            - "null"
          description: Plain text, at most 1 KiB in UTF-8.
      required:
        - id
        - receivedAt
        - category
        - message
        - appVersion
        - routeFamily
        - state
        - submitterId
        - claimedBy
        - closedBy
        - disposition
      additionalProperties: false
    TaskId:
      type: string
      description: Unique task identifier (UUID)
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    Task:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/TaskId"
        title:
          type: string
          description: Task title — the primary human-readable label
        description:
          type: string
          nullable: true
          description: Rich text task description
        status:
          type: string
          enum:
            - todo
            - in_progress
            - complete
            - archived
          description: Current task lifecycle state
        priority:
          type: integer
          minimum: 0
          maximum: 5
          description: "Priority level: 0=none, 1=lowest, 5=critical"
        due_date:
          type: string
          format: date-time
          nullable: true
        assigned_to:
          type: string
          nullable: true
          description: User ID prefixed with 'ha_' or 'custom_'
        area_id:
          type: string
          nullable: true
        goal_id:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        parent_id:
          type: string
          nullable: true
          description: Parent task ID for subtask hierarchy
        task_kind:
          type: string
          enum:
            - standard_action
            - shopping_item
            - checklist
            - routine_instance
            - calendar_event
            - quick_capture
          description: Behavioral kind — determines UI rendering and lifecycle rules
        labels:
          type: string
          nullable: true
          description: Comma-separated label names
        checklists:
          type:
            - string
            - "null"
          description: A JSON-encoded array of checklist items with text, done, and an optional id. Historical tasks may have null.
        board_name:
          type: string
          nullable: true
        ticket_key:
          type: string
          nullable: true
          description: Human-readable key like MTH-42
        created_at:
          type: integer
          description: Unix timestamp (ms)
        updated_at:
          type: integer
          description: Unix timestamp (ms)
      required:
        - id
        - title
        - status
      additionalProperties: false
    Area:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sort_order:
          type: integer
      required:
        - id
        - name
      additionalProperties: false
    Goal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        area_id:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - paused
            - completed
            - abandoned
        metric_type:
          type: string
          nullable: true
        metric_target:
          type: number
          nullable: true
        metric_current:
          type: number
          nullable: true
      required:
        - id
        - title
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        area_id:
          type: string
          nullable: true
        goal_id:
          type: string
          nullable: true
        status:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    Pillar:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        identity_statement:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sort_order:
          type: integer
      required:
        - id
        - name
      additionalProperties: false
    Label:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        color:
          type: string
      required:
        - id
        - title
      additionalProperties: false
    Setting:
      type: object
      properties:
        key:
          type: string
        value: {}
      required:
        - key
        - value
      additionalProperties: false
    WebhookEvent:
      type: object
      description: Outbound event fired on task lifecycle changes. Subscribe via webhook settings or HA event bus.
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - task.created
            - task.updated
            - task.completed
            - task.deleted
            - task.overdue
            - area.updated
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
        payload:
          type: object
      required:
        - eventId
        - eventType
        - occurredAt
        - payload
      additionalProperties: false
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details (application/problem+json). Agents MUST read `invalidParams` to self-correct
        validation errors.
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type — resolves to human docs
        title:
          type: string
          description: Short human-readable summary of the problem type
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation for this specific occurrence
        instance:
          type: string
          description: URI reference identifying the specific request path
        traceId:
          type: string
          description: Trace ID for correlation with structured logs
        error:
          type: string
          description: Legacy alias for detail — backward compatibility
        invalidParams:
          type: array
          description: Validation errors — agents should rewrite payload fields listed here and retry
          items:
            type: object
            properties:
              name:
                type: string
                description: JSON path to the invalid field (e.g., body.title)
              reason:
                type: string
                description: Why the field is invalid
            required:
              - name
              - reason
            additionalProperties: false
      required:
        - type
        - title
        - status
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
        db_status:
          type: string
        db_integrity:
          type: string
        schema_version:
          type: integer
        ha_mode:
          type: string
          enum:
            - ha-addon
            - standalone
        supervisor_reachable:
          type: boolean
      additionalProperties: false
    SearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
        total:
          type: integer
        scope:
          type: string
        query:
          type: string
      additionalProperties: false
    AgentScope:
      type: string
      enum:
        - tasks:read
        - tasks:write
        - projects:read
        - projects:write
        - pillars:read
        - pillars:write
        - search:read
        - settings:read
        - settings:write
        - webhooks:manage
        - admin:*
      description: "Fine-grained permission scope for agent tokens. Use least-privilege: grant only what the agent needs."
    AgentToken:
      type: object
      description: Public metadata for an agent token. The plaintext token is only returned once on creation.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human label (e.g., 'n8n-prod', 'claude-agent')
        tokenPrefix:
          type: string
          description: First 8 chars of the token for identification (e.g., 'mth_a1b2')
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AgentScope"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
      required:
        - id
        - name
        - tokenPrefix
        - scopes
        - createdAt
      additionalProperties: false
    CreateAgentTokenRequest:
      type: object
      description: Payload for creating a new agent token. Scopes determine API access.
      properties:
        name:
          type: string
          description: Human label for the token
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AgentScope"
          minItems: 1
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry. Null = no expiry.
      required:
        - name
        - scopes
      additionalProperties: false
    CreateAgentTokenResponse:
      type: object
      description: Response from token creation — includes the plaintext token (shown ONCE).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: ⚠️ Show-once. The Bearer token the agent must use. Never stored or retrievable again.
        tokenPrefix:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AgentScope"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - token
        - tokenPrefix
        - scopes
        - createdAt
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Meitheal API token (mth_... prefix). Administrators create tokens via POST /api/agent-tokens with the
        scopes the client needs.
    haIngressSession:
      type: apiKey
      in: cookie
      name: ingress_session
      description: Home Assistant browser session. Supervisor validates it and asserts the user on the trusted transport.
    haIngressToken:
      type: apiKey
      in: header
      name: Authorization
      description: Home Assistant Supervisor ingress token (auto-injected by HA)
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health, features, and license
  - name: Tasks
    description: Task CRUD and sub-resources (comments, links, time, activity)
  - name: Search
    description: Universal search across all content types
  - name: Hierarchy
    description: Areas → Goals → Projects organizational structure
  - name: Pillars
    description: Identity pillars (the WHY layer), principles, and associations
  - name: Labels
    description: Task labels for categorization
  - name: Habits
    description: Habit templates, streaks, and routine tracking
  - name: Local feedback
    description: Household Settings workflow behind verified Home Assistant ingress.
  - name: Settings
    description: Application configuration
  - name: Views
    description: Kanban lanes, saved filters, and view configuration
  - name: Users
    description: User management (HA + custom)
  - name: Progress
    description: Gamification, achievements, and XP
  - name: Focus
    description: Pomodoro and focus session tracking
  - name: Review
    description: Weekly review, velocity, and productivity insights
  - name: Strategy
    description: Strategic frameworks (RICE scoring, etc.)
  - name: Automation
    description: Rules engine for automatic task mutations
  - name: Export
    description: Data export (JSON, CSV, ICS, SQLite)
  - name: Events
    description: Server-sent events for real-time updates
  - name: HomeAssistant
    description: Home Assistant integration endpoints
  - name: Integrations
    description: External integrations (n8n, Node-RED, Grocy, calendar)
  - name: Agents
    description: MCP and A2A agent protocol endpoints
  - name: Auth
    description: Agent token management — zero-trust authorization for automations
paths:
  /api/feedback:
    post:
      operationId: submitLocalFeedback
      tags: &a7
        - Local feedback
      summary: Save local feedback and return a durable receipt
      description: Available to verified Home Assistant ingress users. An identical retry returns the same receipt.
      security: &a8
        - haIngressSession: []
      parameters:
        - &a14
          in: header
          name: X-Meitheal-Feedback
          required: true
          schema:
            type: string
            const: "1"
          description: Same-origin Settings request marker. The route also checks Fetch Metadata when the browser provides it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmission"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
        "400": &a10
          description: Validation error (RFC 9457 — read invalidParams to self-correct)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403": &a11
          description: A verified Home Assistant ingress user with the required role is needed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: This submission ID was already used with different content.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "413": &a15
          description: The request body exceeds 8 KiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415": &a16
          description: The request body must be application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500": &a12
          description: Internal server error (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503": &a13
          description: The local feedback database is busy or the queue is full.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      operationId: listLocalFeedback
      tags: *a7
      summary: List local feedback for a verified Home Assistant administrator
      description: Returns up to 50 reports. Pass both parts of nextCursor for the next page.
      security: *a8
      parameters:
        - in: query
          name: state
          schema: *a9
        - in: query
          name: before
          schema: *a6
        - in: query
          name: beforeId
          schema: *a5
      responses:
        "200":
          description: Local reports and cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeedbackReport"
                  nextCursor:
                    anyOf:
                      - $ref: "#/components/schemas/FeedbackReceipt"
                      - type: "null"
                required:
                  - reports
                  - nextCursor
                additionalProperties: false
        "400": *a10
        "403": *a11
        "500": *a12
        "503": *a13
  /api/feedback/{id}:
    patch:
      operationId: reviewLocalFeedback
      tags: *a7
      summary: Claim or close a report as a verified Home Assistant administrator
      security: *a8
      parameters:
        - &a17
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - *a14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum:
                    - in_progress
                    - resolved
                    - declined
                disposition:
                  type: string
                  maxLength: 1024
                  description: Required for closure, omitted for claim. At most 1 KiB in UTF-8.
              required:
                - state
              additionalProperties: false
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReport"
        "400": *a10
        "403": *a11
        "404":
          description: Report no longer exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: The report changed or the state transition is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "413": *a15
        "415": *a16
        "500": *a12
        "503": *a13
    delete:
      operationId: deleteLocalFeedback
      tags: *a7
      summary: Permanently delete a closed report as a verified Home Assistant administrator
      security: *a8
      parameters:
        - *a17
        - *a14
      responses:
        "204":
          description: Report removed
        "400": *a10
        "403": *a11
        "404":
          description: Report no longer exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Close the report before deletion.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500": *a12
        "503": *a13
  /api/feedback/{id}/export:
    post:
      operationId: prepareLocalFeedbackExport
      tags: *a7
      summary: Preview a reviewed report as a verified Home Assistant administrator
      security: *a8
      parameters:
        - *a17
        - *a14
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewedMessage: *a2
              required:
                - reviewedMessage
              additionalProperties: false
      responses:
        "200":
          description: Reviewed text and selected context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackExport"
        "400": *a10
        "403": *a11
        "404":
          description: Report no longer exists.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "413": *a15
        "415": *a16
        "500": *a12
        "503": *a13
  /api/health:
    get:
      operationId: getHealth
      tags:
        - System
      summary: Health and readiness probe
      description: Use this to verify Meitheal is running before making other API calls. Returns version, uptime, database
        status, and Home Assistant connectivity. Call this first in any automation workflow.
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      operationId: healthPing
      tags:
        - System
      summary: Lightweight liveness ping
      description: Ultra-fast liveness check with no response body. Use this for frequent polling (e.g., every 30s) instead of
        the full GET health endpoint.
      responses:
        "200":
          description: Alive
        "503":
          description: Down
  /api/tasks:
    get:
      operationId: listTasks
      tags:
        - Tasks
      summary: List all tasks with optional filters
      description: Retrieve tasks filtered by status, area, project, labels, priority, assignee, board, or due date. Use sort
        and limit parameters for pagination. This is the primary read endpoint for task management automations.
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: "Filter: todo, in_progress, complete, archived"
        - name: area_id
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: board_name
          in: query
          schema:
            type: string
        - name: assigned_to
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: integer
        - name: due_date
          in: query
          schema:
            type: string
            format: date
          description: Match the stored calendar day, either a date-only value or the date written in a stored ISO timestamp.
            Invalid dates return 400.
        - name: parent_id
          in: query
          schema:
            type: string
          description: Get subtasks of a parent
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created
              - updated
              - priority
              - due_date
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          description: Invalid task filter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500": *a12
  /api/tasks/today-counts:
    get:
      operationId: getTodayTaskCounts
      tags:
        - Tasks
      summary: Get the Today page task counters
      description: Returns counts over the full task database using the Today page rules. No task rows are returned.
      responses:
        "200":
          description: Today counters
          content:
            application/json:
              schema:
                type: object
                required:
                  - dueToday
                  - completedToday
                  - carriedForward
                  - remaining
                  - completionPercent
                properties:
                  dueToday:
                    type: integer
                    minimum: 0
                  completedToday:
                    type: integer
                    minimum: 0
                  carriedForward:
                    type: integer
                    minimum: 0
                  remaining:
                    type: integer
                    minimum: 0
                  completionPercent:
                    type: integer
                    minimum: 0
                    maximum: 100
                additionalProperties: false
        "503":
          description: Today counters unavailable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/tasks/create:
    post:
      operationId: createTask
      tags:
        - Tasks
      summary: Create a new task
      description: Create a task with optional calendar sync, assignment, and framework payload. Authenticated callers can
        retry an identical request with the Idempotency-Key header. Use this when a user or agent wants to capture a new
        action item.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: Prevents duplicate creation on retry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Task title (required)
                description:
                  type: string
                status:
                  type: string
                  default: todo
                priority:
                  type: integer
                due_date:
                  type: string
                  format: date-time
                assigned_to:
                  type: string
                  description: Must start with 'ha_' or 'custom_'
                area_id:
                  type: string
                project_id:
                  type: string
                parent_id:
                  type: string
                labels:
                  type: string
                board_name:
                  type: string
                task_kind:
                  type: string
                frameworkPayload:
                  type: object
                calendar:
                  type: object
                  properties:
                    entityId:
                      type: string
                    startDateTime:
                      type: string
                      format: date-time
                    endDateTime:
                      type: string
                      format: date-time
                    durationMinutes:
                      type: integer
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: Idempotent replay — task already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400": *a10
        "500": *a12
  /api/tasks/{id}:
    get:
      operationId: getTask
      tags:
        - Tasks
      summary: Get a single task by ID
      description: Retrieve full task details including subtasks, checklists, comments count, and framework payload. Use this
        before updating a task to get its current state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      operationId: updateTask
      tags:
        - Tasks
      summary: Update a task
      description: Send only the fields you want to change. PATCH accepts the same fields as PUT. Set project_id to an
        existing project ID to move the task, or null to clear the assignment. Changing the project preserves task area
        and status. Setting status to 'complete' triggers webhook events and optional calendar cleanup. With
        expected_status 'backlog', send the exact updated_at from the current task and a target status of 'pending' or
        'active'. To guard a checklist write, include checklists and expected_checklists. Set expected_checklists to the
        exact checklist string or null returned by GET.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                description:
                  type: string
                  description: Task text. The server keeps the first 10,000 characters.
                status:
                  type: string
                  description: Canonical task status, a supported alias, or a custom status. Backlog decisions require exactly pending or
                    active.
                priority:
                  type: number
                  description: The server rounds and clamps this to 1 through 5.
                due_date:
                  type:
                    - string
                    - "null"
                assigned_to:
                  type:
                    - string
                    - "null"
                project_id:
                  type:
                    - string
                    - "null"
                parent_id:
                  type:
                    - string
                    - "null"
                area_id:
                  type: string
                labels:
                  type: string
                  description: JSON-encoded array of label names
                  example: '["repair","garage"]'
                checklists:
                  type: string
                  description: Replacement JSON-encoded checklist array
                expected_checklists:
                  type:
                    - string
                    - "null"
                  description: Exact previous checklist value returned by GET
                updated_at:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                  description: Observed task version as epoch milliseconds. Send the exact observed value with expected_status backlog.
                expected_status:
                  type: string
                  const: backlog
                  description: Requires exact updated_at and status pending or active. The task must still be in Backlog.
              dependentRequired:
                expected_checklists:
                  - checklists
              if:
                required:
                  - expected_status
              then:
                required:
                  - updated_at
                  - status
                properties:
                  status:
                    enum:
                      - pending
                      - active
              additionalProperties: true
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400": *a10
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Task version, intake state or checklist changed, dependencies remain open, or the destination is unavailable
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required:
                      - error
                      - code
                      - checklists
                    properties:
                      error:
                        type: string
                      code:
                        const: checklist_conflict
                      checklists:
                        type:
                          - string
                          - "null"
                    additionalProperties: false
                  - type: object
                    required:
                      - error
                      - errorCode
                      - server_updated_at
                      - client_updated_at
                    properties:
                      error:
                        type: string
                      errorCode:
                        const: TASK_VERSION_CONFLICT
                      server_updated_at:
                        type: integer
                      client_updated_at:
                        type: integer
                    additionalProperties: false
                  - type: object
                    required:
                      - error
                      - errorCode
                      - blocked_by
                    properties:
                      error:
                        type: string
                      errorCode:
                        const: TASK_BLOCKED
                      blocked_by:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                            - title
                            - status
                            - ticket_key
                          properties:
                            id:
                              type: string
                            title:
                              type: string
                            status:
                              type: string
                            ticket_key:
                              type:
                                - string
                                - "null"
                          additionalProperties: false
                    additionalProperties: false
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      operationId: deleteTask
      tags:
        - Tasks
      summary: Delete a task
      description: Permanently removes a task and its domain events. Consider setting status to 'archived' instead if you want
        recoverability.
      parameters:
        - name: id
          in: path
          required: true
