  /api/mcp:
    post:
      operationId: mcpEndpoint
      tags:
        - Agents
      summary: Model Context Protocol JSON-RPC endpoint
      description: "JSON-RPC 2.0 server for AI agents. Supports methods: initialize, tools/list, tools/call. Tools are
        dynamically generated from this OpenAPI spec. Use this for programmatic AI agent integration."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  const: "2.0"
                id:
                  type: string
                method:
                  type: string
                  enum:
                    - initialize
                    - tools/list
                    - tools/call
                params:
                  type: object
              additionalProperties: false
      responses:
        "200":
          description: JSON-RPC response
