openapi: 3.1.0
info:
  title: Meitheal Hub API
  version: 0.2.35
  description: >-
    Meitheal is a Home Assistant-native household and homelab execution hub. This API powers task management, strategic
    planning, habits, calendar sync, agent orchestration, and automation integrations. All endpoints accept and return
    JSON unless noted otherwise.


    **For AI agents**: Use operationId values as tool names. Prefer searchMeitheal for discovery, createTask/updateTask
    for mutations. Check getHealth before starting workflows.
  contact:
    name: Ryan Winkler
    url: https://github.com/Coolock-Village/meitheal
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
    description: Local / HA ingress (relative)
  - url: http://localhost:4321
    description: Development server
components:
  schemas:
    TaskId:
      type: string
      description: Unique task identifier (UUID)
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    Task:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/TaskId"
        title:
          type: string
          description: Task title — the primary human-readable label
        description:
          type: string
          nullable: true
          description: Rich text task description
        status:
          type: string
          description: Configured status key; complete is the canonical completed state
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: "Priority: 1=urgent, 2=high, 3=medium, 4=low, 5=lowest"
        due_date:
          type: string
          nullable: true
          description: ISO date or date-time
        nfc_tag_id: &a16
          type: string
          nullable: true
          description: Assigned NFC tag; set through task update
        kanban_position:
          type: number
          description: Persisted task ordering
        assigned_to:
          type: string
          nullable: true
          description: User ID prefixed with 'ha_' or 'custom_'
        area_id:
          type: string
          nullable: true
        goal_id:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        parent_id:
          type: string
          nullable: true
          description: Parent task ID for subtask hierarchy
        task_kind:
          type: string
          enum:
            - standard_action
            - shopping_item
            - checklist
            - routine_instance
            - calendar_event
            - quick_capture
          description: Behavioral kind — determines UI rendering and lifecycle rules
        labels:
          type: string
          nullable: true
          description: JSON-encoded array of label strings
        board_name:
          type: string
          nullable: true
        ticket_key:
          type: string
          nullable: true
          description: Human-readable key like MTH-42
        created_at:
          type: integer
          description: Unix timestamp (ms)
        updated_at:
          type: integer
          description: Unix timestamp (ms)
      required:
        - id
        - title
        - status
      additionalProperties: false
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title: &a1
          type: string
          minLength: 1
          maxLength: 500
        description: &a2
          type: string
          maxLength: 10000
        urgency: &a3
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        importance: &a4
          type: integer
          minimum: 0
          maximum: 5
          default: 0
        status: &a5
          type: string
          default: pending
        priority: &a6
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        due_date: &a7
          type: string
          nullable: true
          description: ISO date or date-time
        labels: &a8
          type: string
          description: JSON-encoded string array
          default: "[]"
        assigned_to: &a9
          type: string
          nullable: true
        area_id: &a10
          type: string
          nullable: true
        project_id: &a11
          type: string
          nullable: true
        goal_id: &a12
          type: string
          nullable: true
        parent_id: &a13
          type: string
          nullable: true
        task_kind: &a14
          type: string
        custom_fields: &a15
          type: string
          description: JSON-encoded object string
      additionalProperties: false
    TaskRule:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
          maxLength: 10000
        ruleType:
          type: string
          enum:
            - strategic-lens
            - ai-scope
            - custom
          default: strategic-lens
        taskTypes:
          type: array
          items:
            type: string
            enum:
              - epic
              - story
              - task
              - documentation
        tags:
          type: array
          items:
            type: string
        lensIds:
          type: array
          items:
            type: string
        aiScope:
          type: object
          description: Advisory AI context; these values are not enforced authorization
        constraints:
          type: string
          maxLength: 10000
        priority:
          type: number
        enabled:
          type: boolean
      additionalProperties: false
    Area:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sort_order:
          type: integer
      required:
        - id
        - name
      additionalProperties: false
    Goal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        area_id:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - paused
            - completed
            - abandoned
        metric_type:
          type: string
          nullable: true
        metric_target:
          type: number
          nullable: true
        metric_current:
          type: number
          nullable: true
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Goal completion percentage
      required:
        - id
        - title
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        area_id:
          type: string
          nullable: true
        goal_id:
          type: string
          nullable: true
        status:
          type: string
      required:
        - id
        - name
      additionalProperties: false
    Pillar:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        identity_statement:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        sort_order:
          type: integer
      required:
        - id
        - name
      additionalProperties: false
    Label:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        color:
          type: string
      required:
        - id
        - title
      additionalProperties: false
    Setting:
      type: object
      properties:
        key:
          type: string
        value: {}
      required:
        - key
        - value
      additionalProperties: false
    WebhookEvent:
      type: object
      description: Outbound event fired on task lifecycle changes. Subscribe via webhook settings or HA event bus.
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - task.created
            - task.updated
            - task.completed
            - task.deleted
            - task.overdue
            - area.updated
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
        payload:
          type: object
      required:
        - eventId
        - eventType
        - occurredAt
        - payload
      additionalProperties: false
    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details (application/problem+json). Agents MUST read `invalidParams` to self-correct
        validation errors.
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type — resolves to human docs
        title:
          type: string
          description: Short human-readable summary of the problem type
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Human-readable explanation for this specific occurrence
        instance:
          type: string
          description: URI reference identifying the specific request path
        traceId:
          type: string
          description: Trace ID for correlation with structured logs
        error:
          type: string
          description: Legacy alias for detail — backward compatibility
        invalidParams:
          type: array
          description: Validation errors — agents should rewrite payload fields listed here and retry
          items:
            type: object
            properties:
              name:
                type: string
                description: JSON path to the invalid field (e.g., body.title)
              reason:
                type: string
                description: Why the field is invalid
            required:
              - name
              - reason
            additionalProperties: false
      required:
        - type
        - title
        - status
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
        version:
          type: string
        time:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
        db_status:
          type: string
        db_integrity:
          type: string
        schema_version:
          type: integer
        ha_mode:
          type: string
          enum:
            - ha-addon
            - standalone
        supervisor_reachable:
          type: boolean
      additionalProperties: false
    SearchResult:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
        total:
          type: integer
        scope:
          type: string
        query:
          type: string
      additionalProperties: false
    AgentScope:
      type: string
      enum:
        - tasks:read
        - tasks:write
        - tasks:propose
        - tasks:delete
        - projects:read
        - projects:write
        - search:read
        - settings:read
        - settings:write
        - webhooks:write
        - mcp:execute
        - a2a:execute
      description: "Fine-grained permission scope for agent tokens. Use least-privilege: grant only what the agent needs."
    AgentToken:
      type: object
      description: Public metadata for an agent token. The plaintext token is only returned once on creation.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Human label (e.g., 'n8n-prod', 'claude-agent')
        tokenPrefix:
          type: string
          description: First 8 chars of the token for identification (e.g., 'mth_a1b2')
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AgentScope"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
      required:
        - id
        - name
        - tokenPrefix
        - scopes
        - createdAt
      additionalProperties: false
    CreateAgentTokenRequest:
      type: object
      description: Payload for creating a new agent token. Scopes determine API access.
      properties:
        name:
          type: string
          description: Human label for the token
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AgentScope"
          minItems: 1
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry. Null = no expiry.
      required:
        - name
        - scopes
      additionalProperties: false
    CreateAgentTokenResponse:
      type: object
      description: Response from token creation — includes the plaintext token (shown ONCE).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        token:
          type: string
          description: ⚠️ Show-once. The Bearer token the agent must use. Never stored or retrievable again.
        tokenPrefix:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/AgentScope"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - token
        - tokenPrefix
        - scopes
        - createdAt
      additionalProperties: false
    TaskUpdate:
      type: object
      properties:
        title: *a1
        description: *a2
        urgency: *a3
        importance: *a4
        status: *a5
        priority: *a6
        due_date: *a7
        labels: *a8
        assigned_to: *a9
        area_id: *a10
        project_id: *a11
        goal_id: *a12
        parent_id: *a13
        task_kind: *a14
        custom_fields: *a15
        nfc_tag_id: *a16
        start_date:
          type: string
          nullable: true
        end_date:
          type: string
          nullable: true
        progress:
          type: integer
          minimum: 0
          maximum: 100
        is_favorite:
          type: boolean
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Agent token (mth_... prefix) or HA long-lived access token. Create tokens via POST /api/agent-tokens with
        least-privilege scopes.
    haIngressToken:
      type: apiKey
      in: header
      name: Authorization
      description: Home Assistant Supervisor ingress token (auto-injected by HA)
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health, features, and license
  - name: Tasks
    description: Task CRUD and sub-resources (comments, links, time, activity)
  - name: Search
    description: Universal search across all content types
  - name: Hierarchy
    description: Areas → Goals → Projects organizational structure
  - name: Pillars
    description: Identity pillars (the WHY layer), principles, and associations
  - name: Labels
    description: Task labels for categorization
  - name: Habits
    description: Habit templates, streaks, and routine tracking
  - name: Settings
    description: Application configuration
  - name: Views
    description: Kanban lanes, saved filters, and view configuration
  - name: Users
    description: User management (HA + custom)
  - name: Progress
    description: Gamification, achievements, and XP
  - name: Focus
    description: Pomodoro and focus session tracking
  - name: Review
    description: Weekly review, velocity, and productivity insights
  - name: Strategy
    description: Strategic frameworks (RICE scoring, etc.)
  - name: Automation
    description: Rules engine for automatic task mutations
  - name: Export
    description: Data export (JSON, CSV, ICS, SQLite)
  - name: Events
    description: Server-sent events for real-time updates
  - name: HomeAssistant
    description: Home Assistant integration endpoints
  - name: Integrations
    description: External integrations (n8n, Node-RED, Grocy, calendar)
  - name: Agents
    description: MCP and A2A agent protocol endpoints
  - name: Auth
    description: Agent token management — zero-trust authorization for automations
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
        - System
      summary: Health and readiness probe
      description: Use this to verify Meitheal is running before making other API calls. Returns version, uptime, database
        status, and Home Assistant connectivity. Call this first in any automation workflow.
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    head:
      operationId: healthPing
      tags:
        - System
      summary: Lightweight liveness ping
      description: Ultra-fast liveness check with no response body. Use this for frequent polling (e.g., every 30s) instead of
        the full GET health endpoint.
      responses:
        "200":
          description: Alive
        "503":
          description: Down
  /api/tasks:
    post:
      operationId: createTask
      tags:
        - Tasks
      summary: Create a task
      description: Canonical task creation. Accepts first-class description, priority and due date; returns the task as a flat
        object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400": &a18
          description: Validation error (RFC 9457 — read invalidParams to self-correct)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500": &a17
          description: Internal server error (RFC 9457)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      operationId: listTasks
      tags:
        - Tasks
      summary: List all tasks with optional filters
      description: Retrieve tasks filtered by status, area, project, label, priority or assignee. Returns a paginated object
        with tasks, total, limit and offset.
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: "Filter: todo, in_progress, complete, archived"
        - name: area_id
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: label
          in: query
          schema:
            type: string
        - name: assigned_to
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: integer
        - name: parent_id
          in: query
          schema:
            type: string
          description: Get subtasks of a parent
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - created_at
              - updated_at
              - title
              - status
              - priority
              - due_date
              - kanban_position
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated task list
          content:
            application/json:
              schema:
                type: object
                required:
                  - tasks
                  - total
                  - limit
                  - offset
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
                additionalProperties: false
        "500": *a17
  /api/nfc/complete:
    post:
      operationId: completeTaskByNfcTag
      tags:
        - Tasks
      summary: Complete the uniquely assigned incomplete task for an NFC tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tag_id
              properties:
                tag_id:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Task completed (or already complete on retry)
        "400": *a18
        "404":
          description: No matching task
        "409":
          description: Tag is assigned ambiguously
        "500": *a17
  /api/tasks/create:
    post:
      operationId: createTaskLegacy
      tags:
        - Tasks
      summary: Create a new task
      description: Create a task with optional calendar sync, assignment, and framework payload. Supports idempotency via
        Idempotency-Key header. Use this when a user or agent wants to capture a new action item.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: Prevents duplicate creation on retry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: Task title (required)
                description:
                  type: string
                status:
                  type: string
                  default: todo
                priority:
                  type: integer
                due_date:
                  type: string
                  format: date-time
                assigned_to:
                  type: string
                  description: Must start with 'ha_' or 'custom_'
                area_id:
                  type: string
                project_id:
                  type: string
                parent_id:
                  type: string
                labels:
                  type: string
                board_name:
                  type: string
                task_kind:
                  type: string
                frameworkPayload:
                  type: object
                calendar:
                  type: object
                  properties:
                    entityId:
                      type: string
                    startDateTime:
                      type: string
                      format: date-time
                    endDateTime:
                      type: string
                      format: date-time
                    durationMinutes:
                      type: integer
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: Idempotent replay — task already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400": *a18
        "500": *a17
  /api/tasks/{id}/handoff:
    post:
      operationId: manageTaskHandoff
      tags:
        - Tasks
      summary: Claim, release, or propose edits to a task
      description: Requires tasks:propose. Claim returns a five-minute lease. Release and propose require that lease and the
        issuing token. Propose sends title or description changes to the administrator review queue without changing the
        task.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Task ID or ticket key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - claim
                    - release
                    - propose
                lease:
                  type: string
                  format: uuid
                  description: Required for release and propose
                summary:
                  type: string
                  maxLength: 500
                  description: Required for propose
                updates:
                  type: object
                  description: Required for propose. Include at least one field.
                  properties:
                    title:
                      type: string
                      minLength: 1
                      maxLength: 500
                    description:
                      type: string
                      maxLength: 10000
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: Claim returns lease and expiresAt. Proposal returns hash and reviewUntil. Times are Unix milliseconds.
        "400":
          description: Invalid handoff request
        "401":
          description: An active agent token is required
        "403":
          description: The agent token lacks tasks:propose
        "404":
          description: Task not found
        "409":
          description: The task, claim, or proposal is unavailable or changed
        "422":
          description: The proposal does not change the task
  /api/tasks/{id}/accept-proposal:
    post:
      operationId: reviewTaskProposal
      tags:
        - Tasks
      summary: Approve or reject a pending task proposal
      description: Home Assistant administrator session and same-site request required. A proposal hash ties the decision to
        the reviewed content. Agent tokens cannot review proposals.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - proposal_hash
              properties:
                action:
                  type: string
                  enum:
                    - accept
                    - reject
                proposal_hash:
                  type: string
                  pattern: ^[a-f0-9]{64}$
              additionalProperties: false
      responses:
        "200":
          description: Review decision applied
        "403":
          description: A same-site Home Assistant administrator session is required
        "409":
          description: The proposal expired, was already reviewed, or its task changed
  /api/tasks/{id}:
    get:
      operationId: getTask
      tags:
        - Tasks
      summary: Get a single task by ID
      description: Retrieve full task details including subtasks, checklists, comments count, and framework payload. Use this
        before updating a task to get its current state.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      operationId: updateTask
      tags:
        - Tasks
      summary: Update a task
      description: Partial update — only send fields you want to change. Setting status to 'complete' triggers webhook events
        and optional calendar cleanup. An empty body is rejected with 400. NFC assignment uses nfc_tag_id (or null to
        clear).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400": *a18
        "404":
          description: Not found
          content:
