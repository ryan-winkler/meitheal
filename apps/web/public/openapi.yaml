      summary: Get A2A agent card for discovery
      responses:
        "200":
          description: Agent card
  /api/a2a/message:
    post:
      operationId: sendA2AMessage
      tags:
        - Agents
      summary: Search task titles through A2A 1.0 JSON-RPC
      description: Requires a2a:execute and search:read. Supports synchronous SendMessage task-title search only; returns a
        message, not a background task. Streaming, push notifications and task tracking are unsupported.
      parameters:
        - name: A2A-Version
          in: header
          required: true
          schema:
            type: string
            enum:
              - "1.0"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - method
                - id
                - params
              properties:
                jsonrpc:
                  type: string
                  enum:
                    - "2.0"
                method:
                  type: string
                  enum:
                    - SendMessage
                    - GetTask
                    - CancelTask
                    - ListTasks
                id:
                  type: string
                params:
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        "200":
          description: JSON-RPC result or error; unknown tasks are never fabricated
        "401":
          description: Agent token required
        "403":
          description: Required scopes missing
        "404":
          description: Protocol disabled
  /api/agent-tokens:
    post:
      operationId: createAgentToken
      tags:
        - Auth
      summary: Create a scoped API token for an agent or automation
      description: >-
        Issue a zero-trust agent token with fine-grained scopes. The plaintext token is returned ONCE in the response —
        store it securely. Requires admin access (HA admin or settings:write scope).


        **For n8n/Node-RED**: Create a token with only the scopes your workflow needs, then set it as Bearer token in
        your HTTP Request node.
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
          description: Prevents duplicate token creation on retry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentTokenRequest"
      responses:
        "201":
          description: Token created — copy the plaintext token immediately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgentTokenResponse"
        "400": *a18
        "403":
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    get:
      operationId: listAgentTokens
      tags:
        - Auth
      summary: List all agent tokens (metadata only)
      description: Returns public metadata for all active tokens. Token hashes and plaintexts are never exposed. Requires
        admin access.
      responses:
        "200":
          description: Token list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentToken"
        "403":
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    patch:
      operationId: updateAgentToken
      tags:
        - Auth
      summary: Update a token's name or scopes
      description: Modify the display name or permission scopes of an existing token. The token value itself cannot be changed
        — revoke and recreate if compromised.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/AgentScope"
              required:
                - id
              additionalProperties: false
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
                additionalProperties: false
        "400": *a18
        "403":
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      operationId: deleteAgentToken
      tags:
        - Auth
      summary: Revoke or permanently delete a token
      description: "By default, soft-revokes the token (keeps record for audit trail). Set `hard: true` to permanently delete.
        Revoked tokens immediately stop working."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                hard:
                  type: boolean
                  default: false
                  description: true = permanent delete, false = soft revoke
              required:
                - id
              additionalProperties: false
      responses:
        "200":
          description: Token revoked or deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
                  action:
                    type: string
                    enum:
                      - revoked
                      - deleted
                additionalProperties: false
        "403":
          description: Admin access required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Token not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
webhooks:
  task.created:
    post:
      operationId: onTaskCreated
      summary: Fires when a new task is created
      description: Delivered to configured webhook endpoints and HA event bus (meitheal_task_created). Payload includes full
        task object.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Acknowledged
  task.updated:
    post:
      operationId: onTaskUpdated
      summary: Fires when a task is updated
      description: Delivered to webhooks and HA event bus (meitheal_task_updated). If status changes to 'complete', also fires
        task.completed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Acknowledged
  task.completed:
    post:
      operationId: onTaskCompleted
      summary: Fires when a task is marked complete
      description: Delivered via meitheal_task_completed HA event. Includes completed_at timestamp.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Acknowledged
  task.deleted:
    post:
      operationId: onTaskDeleted
      summary: Fires when a task is permanently deleted
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Acknowledged
  task.overdue:
    post:
      operationId: onTaskOverdue
      summary: Fires when a task passes its due date without completion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Acknowledged
  area.updated:
    post:
      operationId: onAreaUpdated
      summary: Fires when an area is modified
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
      responses:
        "200":
          description: Acknowledged
