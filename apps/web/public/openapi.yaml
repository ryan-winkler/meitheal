openapi: "3.0.3"
info:
  title: Meitheal Task & Life Engine API
  description: |
    Local-first task and life management API for Home Assistant.

    Meitheal is an Astro-native task engine designed to run as a
    Home Assistant add-on behind Supervisor ingress.

    ## Authentication
    - Home Assistant ingress: `hassio_token` header (validated by Supervisor)
    - Standalone mode: No auth required (local network only)

    ## Rate Limits
    All POST/PUT/DELETE endpoints: 60 requests per minute per client.

    ## Input Sanitization
    All text inputs are HTML-stripped and length-capped.
  version: "1.0.0"
  contact:
    name: Coolock Village
    url: https://github.com/Coolock-Village/meitheal
  license:
    name: AGPL-3.0
    url: https://github.com/Coolock-Village/meitheal/blob/main/LICENSE

servers:
  - url: http://localhost:4321
    description: Local development (Astro dev server)
  - url: http://localhost:3000
    description: Home Assistant add-on runtime

tags:
  - name: Tasks
    description: Task CRUD operations
  - name: Search
    description: Universal search across tasks, views, settings, and actions
  - name: Health
    description: System health and connectivity
  - name: Settings
    description: User preferences and configuration
  - name: Labels
    description: Task label management
  - name: Integrations
    description: Home Assistant and external service integration
  - name: Unfurl
    description: URL metadata extraction

paths:
  /api/health:
    get:
      tags: [Health]
      summary: System health check
      operationId: getHealth
      description: |
        Returns database connectivity status and system metadata.
        Used by the sidebar connection indicator.
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                  timestamp:
                    type: string
                    format: date-time

  /api/tasks:
    get:
      tags: [Tasks]
      summary: List tasks with optional filtering
      operationId: listTasks
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Basic free-text search across task title and description
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, in_progress, complete, done]
        - name: task_type
          in: query
          schema:
            type: string
            enum: [epic, story, task]
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  total:
                    type: integer
    post:
      tags: [Tasks]
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "200":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error

  /api/search:
    get:
      tags: [Search]
      summary: Universal search across Meitheal
      operationId: searchMeitheal
      description: |
        Returns sectioned search results for tasks, boards, saved filters,
        settings, and quick actions used by the global search hub.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query text
        - name: scope
          in: query
          schema:
            type: string
            enum: [all, tasks, views, settings, actions]
            default: all
          description: Restrict search to one result family
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, updated]
            default: relevance
          description: Task ordering strategy
        - name: task_fields
          in: query
          schema:
            type: string
          description: Comma-delimited task fields to search (`id,title,description,labels,custom_fields,comments`)
        - name: include_completed
          in: query
          schema:
            type: boolean
            default: false
          description: Include completed tasks in task results
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
          description: Include archived tasks in task results
        - name: status
          in: query
          schema:
            type: string
          description: Optional task status filter
        - name: priority
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Optional task priority filter
        - name: assigned_to
          in: query
          schema:
            type: string
          description: Optional task assignee filter
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 8
          description: Maximum results per section
      responses:
        "200":
          description: Sectioned search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /api/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get a single task
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
    put:
      tags: [Tasks]
      summary: Update a task
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Task updated
        "404":
          description: Task not found
    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task deleted
        "404":
          description: Task not found

  /api/labels:
    get:
      tags: [Labels]
      summary: List all labels
      operationId: listLabels
      responses:
        "200":
          description: Label list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"
    post:
      tags: [Labels]
      summary: Create a label
      operationId: createLabel
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 100
                hex_color:
                  type: string
                  pattern: "^#[0-9a-fA-F]{6}$"
      responses:
        "200":
          description: Label created

  /api/settings:
    get:
      tags: [Settings]
      summary: Get all user settings
      operationId: getSettings
      responses:
        "200":
          description: Settings object
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags: [Settings]
      summary: Update a setting
      operationId: updateSetting
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key:
                  type: string
                  maxLength: 100
                value:
                  type: string
                  maxLength: 10000
      responses:
        "200":
          description: Setting updated

  /api/unfurl:
    get:
      tags: [Unfurl]
      summary: Extract metadata from a URL
      operationId: unfurlUrl
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: URL metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  title:
                    type: string
                  description:
                    type: string
                  image:
                    type: string
                  url:
                    type: string

  /api/ha/entities:
    get:
      tags: [Integrations]
      summary: List Home Assistant entities
      operationId: listHaEntities
      description: |
        Proxies to the HA Supervisor API to list all entities.
        Only available when running as an HA add-on.
      responses:
        "200":
          description: Entity list
        "502":
          description: HA Supervisor not available

  /api/ha/services:
    get:
      tags: [Integrations]
      summary: List Home Assistant services
      operationId: listHaServices
      responses:
        "200":
          description: Service list
        "502":
          description: HA Supervisor not available

  /api/ha/call:
    post:
      tags: [Integrations]
      summary: Call a Home Assistant service
      operationId: callHaService
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [domain, service]
              properties:
                domain:
                  type: string
                service:
                  type: string
                target:
                  type: object
                data:
                  type: object
      responses:
        "200":
          description: Service called
        "502":
          description: HA Supervisor not available

  /api/v1/calendar/sync:
    post:
      tags: [Integrations]
      summary: Sync task to HA calendar
      operationId: syncTaskToCalendar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [task_id]
              properties:
                task_id:
                  type: string
      responses:
        "200":
          description: Sync result
        "404":
          description: Task not found

  /api/integrations/vikunja/tasks:
    get:
      tags: [Integrations]
      summary: List tasks via Vikunja compatibility layer
      operationId: listVikunjaTasks
      responses:
        "200":
          description: Vikunja-format task list

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, active, in_progress, complete, done]
        task_type:
          type: string
          enum: [epic, story, task]
        priority:
          type: integer
          minimum: 1
          maximum: 5
        due_date:
          type: string
          format: date-time
          nullable: true
        labels:
          type: string
          description: JSON-encoded array of label names
        framework_payload:
          type: string
          description: JSON-encoded framework scoring data (RICE, HEART, etc.)
        calendar_sync_state:
          type: string
          enum: [none, pending, synced, error]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 10000
        status:
          type: string
          default: pending
        task_type:
          type: string
          enum: [epic, story, task]
          default: task
        priority:
          type: integer
          default: 3
        due_date:
          type: string
          format: date-time
          nullable: true
        labels:
          type: string
        framework_payload:
          type: string

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: integer
        due_date:
          type: string
          nullable: true

    Label:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        hex_color:
          type: string
        created_at:
          type: string
          format: date-time

    SearchResultItem:
      type: object
      required: [id, kind, title]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [task, board, saved_filter, setting, page, action]
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        href:
          type: string
          nullable: true
        taskId:
          type: string
          nullable: true
        actionId:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        meta:
          type: object
          additionalProperties: true

    SearchResultSection:
      type: object
      required: [id, label, items]
      properties:
        id:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"

    SearchResponse:
      type: object
      required: [query, sections, meta]
      properties:
        query:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultSection"
        meta:
          type: object
          required: [scope, limit, include_completed, include_archived, sort, task_fields]
          properties:
            scope:
              type: string
              enum: [all, tasks, views, settings, actions]
            limit:
              type: integer
            include_completed:
              type: boolean
            include_archived:
              type: boolean
            sort:
              type: string
              enum: [relevance, updated]
            task_fields:
              type: array
              items:
                type: string

  # --- Data Export & Import Endpoints (Phase 21) ---

  /api/export/tasks.json:
    get:
      tags: [Tasks]
      summary: Export all tasks as JSON
      operationId: exportTasksJson
      description: Downloads all tasks from the server-side SQLite database as a JSON file.
      responses:
        "200":
          description: JSON file download
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /api/export/tasks.csv:
    get:
      tags: [Tasks]
      summary: Export all tasks as CSV
      operationId: exportTasksCsv
      description: Downloads all tasks as a CSV file with proper field escaping.
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
        "204":
          description: No tasks to export

  /api/export/database.sqlite:
    get:
      tags: [Health]
      summary: Download raw SQLite database
      operationId: exportDatabase
      description: Streams the raw meitheal.db file for full local-first data sovereignty.
      responses:
        "200":
          description: SQLite binary download
          content:
            application/x-sqlite3:
              schema:
                type: string
                format: binary
        "400":
          description: Database is not file-based
        "404":
          description: Database file not found

  /api/export/settings.json:
    get:
      tags: [Settings]
      summary: Export settings as JSON
      operationId: exportSettings
      description: Downloads all user settings as a key-value JSON file.
      responses:
        "200":
          description: Settings JSON download
          content:
            application/json:
              schema:
                type: object

  /api/import/settings:
    post:
      tags: [Settings]
      summary: Import settings from JSON
      operationId: importSettings
      description: Accepts a JSON payload of settings (key allowlisted) and bulk-upserts them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Key-value pairs of settings to import
      responses:
        "200":
          description: Settings imported successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          description: Invalid payload or no valid keys
