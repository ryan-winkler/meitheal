configuration:
  log_level:
    name: Log level
    description: >-
      Sets how much the app writes to the log. Use "debug" to find a problem,
      "info" for normal use, and "warn" or "error" for fewer messages.
  log_categories:
    name: Log categories
    description: >-
      Sets which parts of the app write debug and info messages. The default is
      auth, tasks, integrations, observability, ha, calendar, todo, api,
      security, search. The app always writes warning and error messages.
  log_redaction:
    name: Log redaction
    description: >-
      Removes tokens, passwords and personal data from log messages before the
      app writes them.
  audit_enabled:
    name: Audit log
    description: >-
      Records security events, such as sign-ins, data exports and
      configuration changes, in a local audit log.
  loki_url:
    name: Loki push URL
    description: >-
      Optional. Enter the HTTP or HTTPS push URL for Grafana Loki without
      embedded credentials, for example http://a0d7b954-loki:3100/loki/api/v1/push.
      Keep this field empty to turn off remote log forwarding.
  license_key:
    name: License key
    description: >-
      Optional. Paste your Meitheal license key here. For personal and homelab
      use, keep this field empty.
