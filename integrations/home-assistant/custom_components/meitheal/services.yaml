create_task:
  name: Create Task
  description: Create a new task in Meitheal.
  fields:
    title:
      name: Title
      description: The title of the task to create
      required: true
      example: "Buy groceries"
      selector:
        text:
    description:
      name: Description
      description: Optional description or notes for the task
      example: "From the organic market"
      selector:
        text:
          multiline: true
    priority:
      name: Priority
      description: Priority from 1 (urgent) to 5 (lowest)
      selector:
        number:
          min: 1
          max: 5
          step: 1
    due_date:
      name: Due date
      description: ISO date or date-time, for example 2026-12-01
      selector:
        text:
    urgency:
      name: Urgency
      description: Eisenhower urgency from 0 (unclassified) to 5 (critical)
      selector:
        number:
          min: 0
          max: 5
          step: 1
    importance:
      name: Importance
      description: Eisenhower importance from 0 (unclassified) to 5 (critical)
      selector:
        number:
          min: 0
          max: 5
          step: 1

complete_task:
  name: Complete Task
  description: Mark a task as done by ID or title.
  fields:
    task_id:
      name: Task ID
      description: The task ID to complete (use either this or title)
      example: "abc123"
      selector:
        text:
    title:
      name: Title
      description: Find and complete a task by title (use either this or task_id)
      example: "Buy groceries"
      selector:
        text:

sync_todo:
  name: Sync Tasks
  description: Trigger a manual refresh of task data from Meitheal.

complete_task_by_tag:
  name: Complete Task by NFC Tag
  description: Complete the unique task assigned this NFC tag. Assign nfc_tag_id through the task API first.
  fields:
    tag_id:
      name: Tag ID
      description: The NFC tag ID assigned to the task
      required: true
      selector:
        text:

search_tasks:
  name: Search Tasks
  description: Search tasks by keyword, status, priority, labels, custom fields, comments, and task IDs.
  fields:
    query:
      name: Search Query
      description: Keyword to search across task titles, descriptions, labels, custom fields, comments, and IDs
      required: true
      example: "groceries"
      selector:
        text:
    status:
      name: Status Filter
      description: Filter by task status
      example: "todo"
      selector:
        select:
          options:
            - "backlog"
            - "todo"
            - "in_progress"
            - "done"
    priority:
      name: Priority Filter
      description: Filter by task priority
      example: 1
      selector:
        number:
          min: 1
          max: 5
          step: 1
    include_completed:
      name: Include Completed
      description: Include completed tasks in the results
      example: false
      selector:
        boolean:

get_overdue_tasks:
  name: Get Overdue Tasks
  description: Get a list of all tasks that are past their due date and not yet completed.

notify_overdue:
  name: Notify Overdue
  description: Push a notification about overdue tasks to HA persistent notifications.
