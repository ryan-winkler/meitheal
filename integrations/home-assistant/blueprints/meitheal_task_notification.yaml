blueprint:
  name: "Meitheal: Task Notification with Actions"
  description: >-
    Send an actionable notification to your phone when a Meitheal task event
    occurs (created, overdue, etc.). The notification includes deep-link actions
    to view or complete the task directly from the companion app.

    Compatible with Android (haptic feedback, deep-links) and iOS.
  domain: automation
  author: "Coolock Village"
  source_url: "https://github.com/ryan-winkler/meitheal/blob/main/integrations/home-assistant/blueprints/meitheal_task_notification.yaml"
  input:
    notify_device:
      name: "Notification Device"
      description: "The mobile device to send notifications to"
      selector:
        device:
          integration: mobile_app
    event_type:
      name: "Task Event"
      description: "Which Meitheal event triggers the notification"
      default: "meitheal_task_created"
      selector:
        select:
          options:
            - label: "Task Created"
              value: "meitheal_task_created"
            - label: "Task Completed"
              value: "meitheal_task_completed"
            - label: "Task Overdue"
              value: "meitheal_task_overdue"
            - label: "Task Updated"
              value: "meitheal_task_updated"
            - label: "Board Changed"
              value: "meitheal_board_updated"
    ingress_path:
      name: "Meitheal sidebar path"
      description: >-
        The Home Assistant path that opens Meitheal from the sidebar, such as
        /meitheal or /meitheal_canary. Open Meitheal from the sidebar and copy
        the first part of the address after your Home Assistant host.
        Do not use an /api/hassio_ingress/ address. It needs a session that
        only the Home Assistant sidebar creates, so it fails from a notification.
      default: "/meitheal"
      selector:
        text:

trigger:
  - platform: event
    event_type: !input event_type

condition:
  - condition: template
    value_template: >-
      {{ trigger.event.data.get('source') == 'meitheal' or
         trigger.event.data.get('domain') == 'meitheal' }}

variables:
  task_title: "{{ trigger.event.data.title | default('Task') }}"
  task_id: >-
    {% set id = trigger.event.data.get('task_id') %}
    {{ id | trim if id is string else '' }}
  event_name: >-
    {% set types = {
      'meitheal_task_created': 'New Task',
      'meitheal_task_completed': 'Task Done',
      'meitheal_task_overdue': 'Overdue',
      'meitheal_task_updated': 'Task Updated',
      'meitheal_board_updated': 'Board Changed'
    } %}
    {{ types.get(trigger.event.event_type, 'Meitheal') }}
  ingress_path: !input ingress_path
  # Relative panel paths open inside the Companion app and use its login.
  # Older automations stored a Supervisor ingress session URL; use the stable panel instead.
  panel_path: >-
    {% set raw = (ingress_path | string | trim).split('?')[0].split('#')[0] %}
    {% if '://' in raw %}{% set raw = '/' ~ (raw.split('://', 1)[1].split('/', 1) + [''])[1] %}{% endif %}
    {% set slug = raw.strip('/').split('/')[0] %}
    {% if slug and slug != 'api' and slug | regex_match('^[a-z0-9_-]{1,128}$') %}/{{ slug }}{% else %}/meitheal{% endif %}
  task_url: >-
    {{ panel_path ~ '?meitheal=' ~ (('/tickets/' ~ (task_id | urlencode)) | urlencode) if task_id else '' }}

action:
  - device_id: !input notify_device
    domain: mobile_app
    type: notify
    title: "{{ event_name }} — Meitheal"
    message: "{{ task_title }}"
    data:
      # Android: vibration pattern for haptic feedback
      vibrationPattern: "100, 200, 100, 200"
      # Android: notification channel for grouping
      channel: "meitheal_tasks"
      # Android: high importance for heads-up display
      importance: high
      # Android: notification group
      group: "meitheal"
      # Android: clickAction opens the Meitheal panel in the Companion app
      clickAction: "{{ task_url if task_id else panel_path }}"
      # iOS: url opens the same panel path
      url: "{{ task_url if task_id else panel_path }}"
      # Android/iOS: notification tag for deduplication
      tag: "meitheal_{{ task_id or trigger.event.event_type }}"
      # Actionable notification buttons
      actions: >-
        {% set dashboard = {'action': 'URI', 'title': '📊 Dashboard', 'uri': panel_path} %}
        {% if task_id %}
          {{ [
            {'action': 'URI', 'title': '📋 View Task', 'uri': task_url},
            {'action': 'MEITHEAL_COMPLETE_' ~ task_id, 'title': '✅ Complete'},
            dashboard
          ] }}
        {% else %}
          {{ [dashboard] }}
        {% endif %}

mode: queued
max: 5
