name: OpenSSF Scorecard Supply-Chain Security

on:
  schedule:
    - cron: '30 3 * * 1'
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard Analysis
        uses: ossf/scorecard-action@f49aabe0b5af09361bc983cedee99d9479b5c296 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload SARIF Results to GitHub Security
        uses: github/codeql-action/upload-sarif@b7bf0b3935da130026e6effa3da31e06497f1f3a # v3.28.10
        with:
          sarif_file: results.sarif
