name: Community Support Automation

on:
  issues:
    types:
      - labeled

permissions:
  issues: write

jobs:
  support-guide:
    if: github.event.label.name == 'bounty' || github.event.label.name == 'fund'
    runs-on: ubuntu-latest
    steps:
      - name: Post Support & Contribution Guidance
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const body = `### 💰 Community Support & Contribution Guidance

            This issue is marked for community contribution and sponsorship support via [GitHub Sponsors](https://github.com/sponsors/ryan-winkler) and [Ko-fi](https://ko-fi.com/ryanw_eu).

            - **To claim**: Submit a pull request linked to this issue.
            - **Requirements**: All CI tests must pass and code must follow repository DDD boundaries.`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body
            });
