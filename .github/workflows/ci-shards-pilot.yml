name: Browser CI comparison

on:
  push:
    branches:
      - codex/ci-sharding-pilot

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-shards-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.inputs.outputs.node }}
      digest: ${{ steps.inputs.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check packages and build the fixture
        run: |
          pnpm --filter @meitheal/domain-auth check
          pnpm --filter @meitheal/domain-observability check
          pnpm --filter @meitheal/domain-strategy check
          pnpm --filter @meitheal/domain-tasks check
          pnpm --filter @meitheal/integration-core check
          pnpm --filter @meitheal/tests check
          pnpm --filter @meitheal/web exec astro check
          pnpm --filter @meitheal/web build
          test ! -e apps/web/dist/client/llms.txt
          test ! -e apps/web/dist/client/llms-full.txt
      - id: inputs
        name: Archive the exact built fixture
        run: |
          archive="$RUNNER_TEMP/pilot-web.tgz"
          tar -C apps/web -czf "$archive" dist
          printf 'node=%s\n' "$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot-web.tgz
          if-no-files-found: error
          retention-days: 3

  shards:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack verified fixture
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$RUNNER_TEMP/pilot-web.tgz" | sha256sum --check
          tar -C apps/web -xzf "$RUNNER_TEMP/pilot-web.tgz"
      - run: pnpm --filter @meitheal/tests exec playwright install chromium
      - name: Run isolated browser specs
        env:
          MEITHEAL_CI_SHARD: ${{ matrix.shard }}/6
          MEITHEAL_CI_EVIDENCE_DIR: ${{ runner.temp }}/shard-evidence
        run: pnpm --filter @meitheal/tests test:ci
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-evidence/
          if-no-files-found: warn
          retention-days: 3

  aggregate:
    name: Parallel browser suite
    if: ${{ always() }}
    needs: [build, shards]
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards to finish successfully
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pilot-${{ github.run_attempt }}-shard-*
          path: ${{ runner.temp }}/parallel
      - name: Verify the full test inventory and combine coverage
        env:
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          for shard in 1 2 3 4 5 6; do
            mv "$RUNNER_TEMP/parallel/pilot-$ATTEMPT-shard-$shard" "$RUNNER_TEMP/parallel/shard-$shard"
          done
          node tests/merge-ci-shards.mjs "$RUNNER_TEMP/parallel" "$RUNNER_TEMP/parallel-results" 6 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-parallel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parallel-results/
          if-no-files-found: error
          retention-days: 3

  control:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot-web-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack verified fixture
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          printf '%s  %s\n' "$EXPECTED_DIGEST" "$RUNNER_TEMP/pilot-web.tgz" | sha256sum --check
          tar -C apps/web -xzf "$RUNNER_TEMP/pilot-web.tgz"
      - run: pnpm --filter @meitheal/tests exec playwright install chromium
      - name: Run existing two-lane test suite
        env:
          MEITHEAL_CI_EVIDENCE_DIR: ${{ runner.temp }}/control/shard-1
        run: pnpm --filter @meitheal/tests test:ci
      - name: Verify control inventory and coverage
        run: node tests/merge-ci-shards.mjs "$RUNNER_TEMP/control" "$RUNNER_TEMP/control-results" 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-control-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-results/
          if-no-files-found: error
          retention-days: 3
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pilot-control-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control/
          if-no-files-found: warn
          retention-days: 3

  compare:
    needs: [aggregate, build, control]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.build.outputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot-parallel-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parallel-results
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pilot-control-${{ github.run_attempt }}
          path: ${{ runner.temp }}/control-results
      - name: Compare exact execution and coverage
        run: node tests/compare-ci-shards.mjs "$RUNNER_TEMP/control-results" "$RUNNER_TEMP/parallel-results" | tee -a "$GITHUB_STEP_SUMMARY"
