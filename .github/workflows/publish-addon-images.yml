name: Publish Stable App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'ryan-winkler/meitheal' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/publish-app.yml
    with:
      channel: stable
    permissions:
      contents: read
      packages: write
    secrets:
      ADDON_REPO_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
