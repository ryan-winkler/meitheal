name: Dynamic analysis (ZAP baseline)

on:
  push:
    branches:
      - dev
      - release
    paths-ignore:
      - "meitheal-hub-canary/config.yaml"
      - "*.md"
      - ".planning/**"
      - "docs/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: Scan the built web app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web app
        run: pnpm --filter @meitheal/web build
      - name: Start the production server with a disposable database
        run: |
          sh tests/ci-web-server.sh 4611 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4611/api/health > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - name: Run the ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:4611/
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
