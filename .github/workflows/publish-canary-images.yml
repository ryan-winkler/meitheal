name: Publish Canary Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - "meitheal-hub-canary/config.yaml"
      - "*.md"
      - ".planning/**"
      - "docs/**"
      - ".github/workflows/publish-canary-images.yml"

  workflow_dispatch:

jobs:
  canary:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - meitheal-canary
      - ${{ matrix.runner_label }}
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner_label: meitheal-canary-amd64
          - arch: aarch64
            platform: linux/arm64
            runner_label: meitheal-canary-aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Log in to Docker Hub
        continue-on-error: true
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            printf '%s' "${DOCKERHUB_TOKEN}" | podman login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
          else
            echo "Docker Hub credentials are not configured; continuing without Docker Hub cache/auth."
          fi

      - name: Resolve canary metadata
        id: meta
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          sha_short="$(git rev-parse --short HEAD)"
          build_from="$(jq -r ".build_from[\"${{ matrix.arch }}\"]" meitheal-hub-canary/build.json)"

          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${sha_short}" >> "$GITHUB_OUTPUT"
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      - name: Build and publish canary image
        run: |
          image="ghcr.io/${{ steps.meta.outputs.owner_lc }}/meitheal-canary-${{ matrix.arch }}"

          podman build \
            --format docker \
            --platform "${{ matrix.platform }}" \
            --build-arg "BUILD_FROM=${{ steps.meta.outputs.build_from }}" \
            -f meitheal-hub/Dockerfile \
            -t "${image}:${{ steps.meta.outputs.sha_short }}" \
            -t "${image}:canary" \
            .

          podman push "${image}:${{ steps.meta.outputs.sha_short }}"
          podman push "${image}:canary"

  # After all arch builds succeed, update config.yaml so HA sees the new version
  update-version:
    needs: canary
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - meitheal-canary
      - meitheal-canary-amd64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update canary config.yaml version via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          node scripts/update-canary-version.mjs "$sha_short"

          # Use GitHub API to commit — bypasses branch protection unlike git push
          file_path="meitheal-hub-canary/config.yaml"
          file_sha="$(gh api "/repos/${{ github.repository }}/contents/${file_path}" --jq '.sha')"
          content_b64="$(base64 -w0 < "${file_path}")"

          gh api --method PUT "/repos/${{ github.repository }}/contents/${file_path}" \
            -f message="🐤 canary: bump version to ${sha_short} [skip ci]" \
            -f content="${content_b64}" \
            -f sha="${file_sha}" \
            -f branch="main" \
            -f "committer[name]=github-actions[bot]" \
            -f "committer[email]=41898282+github-actions[bot]@users.noreply.github.com"

      # sync-addon-repo.yml skips bot commits (github.actor != 'github-actions[bot]'),
      # so we must push the bumped config.yaml to the public repo directly here.
      - name: Sync canary config to public add-on repo
        env:
          GH_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          node scripts/update-canary-version.mjs "$sha_short"

          file_path="meitheal-hub-canary/config.yaml"
          content_b64="$(base64 -w0 < "${file_path}")"

          # Get current SHA of the file in the public repo
          public_sha="$(gh api "/repos/Coolock-Village/meitheal-ha-addon/contents/${file_path}" --jq '.sha')" || true

          if [ -n "$public_sha" ]; then
            gh api --method PUT "/repos/Coolock-Village/meitheal-ha-addon/contents/${file_path}" \
              -f message="🐤 canary: bump version to ${sha_short} [skip ci]" \
              -f content="${content_b64}" \
              -f sha="${public_sha}" \
              -f branch="main" \
              -f "committer[name]=github-actions[bot]" \
              -f "committer[email]=41898282+github-actions[bot]@users.noreply.github.com"
          else
            gh api --method PUT "/repos/Coolock-Village/meitheal-ha-addon/contents/${file_path}" \
              -f message="🐤 canary: bump version to ${sha_short} [skip ci]" \
              -f content="${content_b64}" \
              -f branch="main" \
              -f "committer[name]=github-actions[bot]" \
              -f "committer[email]=41898282+github-actions[bot]@users.noreply.github.com"
          fi
