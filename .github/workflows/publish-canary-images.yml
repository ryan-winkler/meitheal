name: Publish Canary Images

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - "meitheal-hub-canary/config.yaml"
      - "*.md"
      - ".planning/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      update_release:
        description: "Auto-update release branch after canary build (dev branch only)"
        type: boolean
        default: true

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve canary metadata
        id: meta
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          sha_short="$(git rev-parse --short HEAD)"
          build_from="$(jq -r ".build_from[\"${{ matrix.arch }}\"]" meitheal-hub-canary/build.json)"

          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${sha_short}" >> "$GITHUB_OUTPUT"
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      - name: Build and publish canary image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: meitheal-hub/Dockerfile
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.build_from }}
          push: true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=canary-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=canary-${{ matrix.arch }},ignore-error=true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/meitheal-canary-${{ matrix.arch }}:${{ steps.meta.outputs.sha_short }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/meitheal-canary-${{ matrix.arch }}:canary
            ghcr.io/coolock-village/meitheal-canary-${{ matrix.arch }}:${{ steps.meta.outputs.sha_short }}
            ghcr.io/coolock-village/meitheal-canary-${{ matrix.arch }}:canary

  update-version:
    needs: canary
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update canary config.yaml version via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          node scripts/update-canary-version.mjs "$sha_short"

          file_path="meitheal-hub-canary/config.yaml"
          file_sha="$(gh api "/repos/${{ github.repository }}/contents/${file_path}" --jq '.sha')"
          content_b64="$(base64 -w0 < "${file_path}")"

          gh api --method PUT "/repos/${{ github.repository }}/contents/${file_path}" \
            -f message="🐤 canary: bump version to ${sha_short}" \
            -f content="${content_b64}" \
            -f sha="${file_sha}" \
            -f branch="${{ github.ref_name }}" \
            -f "committer[name]=github-actions[bot]" \
            -f "committer[email]=41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync canary config to public add-on repo
        if: env.HAS_ADDON_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
          HAS_ADDON_TOKEN: ${{ secrets.ADDON_REPO_TOKEN != '' }}
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          node scripts/update-canary-version.mjs "$sha_short"

          file_path="meitheal-hub-canary/config.yaml"
          content_b64="$(base64 -w0 < "${file_path}")"

          public_sha="$(gh api "/repos/Coolock-Village/meitheal-ha-addon/contents/${file_path}" --jq '.sha')" || true

          if [ -n "$public_sha" ]; then
            gh api --method PUT "/repos/Coolock-Village/meitheal-ha-addon/contents/${file_path}" \
              -f message="🐤 canary: bump version to ${sha_short}" \
              -f content="${content_b64}" \
              -f sha="${public_sha}" \
              -f branch="main" \
              -f "committer[name]=github-actions[bot]" \
              -f "committer[email]=41898282+github-actions[bot]@users.noreply.github.com"
          else
            gh api --method PUT "/repos/Coolock-Village/meitheal-ha-addon/contents/${file_path}" \
              -f message="🐤 canary: bump version to ${sha_short}" \
              -f content="${content_b64}" \
              -f branch="main" \
              -f "committer[name]=github-actions[bot]" \
              -f "committer[email]=41898282+github-actions[bot]@users.noreply.github.com"
          fi

  update-release-branch:
    needs: [canary, update-version]
    if: github.ref_name == 'dev' && github.actor != 'github-actions[bot]' && (github.event.inputs.update_release != 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward or merge release branch to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge --ff-only origin/dev || git merge origin/dev -m "chore(release): auto-update release from dev"
          git push origin release
