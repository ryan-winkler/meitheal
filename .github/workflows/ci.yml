name: CI

on:
  push:
    branches:
      - main
      - dev
      - release
    paths:
      - "**"
      - "!meitheal-hub-canary/config.yaml"
      - "!*.md"
      - "README.md"
      - "AGENTS.md"
      - "WEBMCP.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SUPPORT.md"
      - "COMMERCIAL.md"
      - "GOVERNANCE.md"
      - "ROADMAP.md"
      - "!.planning/**"
      - "!docs/**"
      - "docs/index.md"
      - "docs/kcs/home-assistant-devcontainer.md"
  pull_request:
    # A base change must refresh CI even when the PR head SHA stays the same.
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
      - dev
      - release

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify required governance files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f .coderabbit.yaml
          test -f COMMERCIAL.md
          test -f LICENSE
          test -f NOTICE
          test ! -d apps/web/src/pages/api/v1
          test ! -d apps/api
          test -f WEBMCP.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SUPPORT.md
          test -f SECURITY.md
          test -f GOVERNANCE.md
          test -f ROADMAP.md
          test -f docs/index.md
          test -f docs/kcs/home-assistant-devcontainer.md
          test -f public/.well-known/mcp.json
          test -f public/.well-known/jsondoc.json
      - name: CSS brace balance check (all partials)
        run: |
          STATUS=0
          for CSS_FILE in apps/web/src/styles/*.css; do
            OPEN=$(grep -o '{' "$CSS_FILE" | wc -l)
            CLOSE=$(grep -o '}' "$CSS_FILE" | wc -l)
            if [ "$OPEN" -ne "$CLOSE" ]; then
              echo "::error file=$CSS_FILE::CSS brace imbalance: $OPEN opening vs $CLOSE closing braces"
              STATUS=1
            fi
          done
          if [ "$STATUS" -eq 0 ]; then
            echo "✅ CSS braces balanced across all partials"
          else
            exit 1
          fi
      - name: Version sync check (VER-02)
        run: node scripts/check-version-sync.mjs

  typecheck-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The isolated spec loop reached spec 295 of 388 at the 45-minute limit.
    # Leave time for the remaining specs and coverage generation.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck domain packages
        run: |
          pnpm --filter @meitheal/domain-auth check
          pnpm --filter @meitheal/domain-observability check
          pnpm --filter @meitheal/domain-strategy check
          pnpm --filter @meitheal/domain-tasks check
          pnpm --filter @meitheal/integration-core check
          pnpm --filter @meitheal/tests check
      - name: Typecheck Astro pages and client code
        run: pnpm --filter @meitheal/web exec astro check
      - name: Build web app
        run: pnpm --filter @meitheal/web build
      - name: Keep internal context out of the web build
        run: |
          test ! -e apps/web/dist/client/llms.txt
          test ! -e apps/web/dist/client/llms-full.txt
      - name: Install the pinned Chromium on the hosted runner
        run: pnpm --filter @meitheal/tests exec playwright install chromium
      - name: Test each spec with a fresh local server
        env:
          MEITHEAL_COVERAGE_FILE: coverage/lcov.info
        run: |
          test_tmp=$(mktemp -d)
          trap 'rm -rf -- "$test_tmp"' EXIT
          TMPDIR="$test_tmp" pnpm --filter @meitheal/tests test:ci
      - name: Archive TypeScript coverage artifact
        if: always() && hashFiles('coverage/lcov.info') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ts
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  ha-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/tests test e2e/ha-calendar-adapter.spec.ts
  ha-core:
    name: Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.10.4"
            requirements: requirements-test-2026.10.txt
          - core: "2026.11.1"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the checked-out App for native protocol tests
        run: pnpm --filter @meitheal/web build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: integrations/home-assistant/${{ matrix.requirements }}
      - name: Test Core integration enrollment and actions
        working-directory: integrations/home-assistant
        env:
          TEST_REQUIREMENTS: ${{ matrix.requirements }}
          MEITHEAL_REQUIRE_APP_PROTOCOL: "1"
          HA_CORE_VERSION: ${{ matrix.core }}
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/ha-venv"
          export VIRTUAL_ENV="$RUNNER_TEMP/ha-venv"
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          uv pip install --require-hashes --no-deps -r "$TEST_REQUIREMENTS"
          if [ "$HA_CORE_VERSION" = "2026.11.1" ]; then
            uv pip check -q
            python -m ruff check .
            python -m pytest -q --cov=custom_components.meitheal --cov-report=xml:coverage-python.xml --cov-report=term-missing:skip-covered
          elif [ "$HA_CORE_VERSION" = "2026.10.4" ]; then
            EXPECTED_PILLOW=$(grep -iE '^[[:space:]]*pillow==' overrides-2026.10.txt | sed -nE 's/^[[:space:]]*[^=]+==([^[:space:]#;\\]+).*/\1/p' | head -n 1)
            [ -n "$EXPECTED_PILLOW" ]
            UV_CHECK_OUT=""
            UV_CHECK_STATUS=0
            UV_CHECK_OUT=$(uv pip check -q 2>&1) || UV_CHECK_STATUS=$?
            ALLOWED_SUMMARY="Found 1 incompatibility"
            ALLOWED_LINE='The package `homeassistant` requires `pillow==12.3.0`, but `'"${EXPECTED_PILLOW}"'` is installed'
            UNEXPECTED=$(printf '%s\n' "$UV_CHECK_OUT" | grep -v '^[[:space:]]*$' | grep -Fvxi "$ALLOWED_SUMMARY" | grep -Fvxi "$ALLOWED_LINE" || true)
            if [ "$UV_CHECK_STATUS" -eq 0 ] || ! printf '%s\n' "$UV_CHECK_OUT" | grep -Fxi "$ALLOWED_LINE" >/dev/null || [ -n "$UNEXPECTED" ]; then
              printf '%s\n' "$UV_CHECK_OUT" >&2
              exit 1
            fi
            python -m pytest -q
          else
            uv pip check -q
            python -m pytest -q
          fi
      - name: Archive Home Assistant Python coverage artifact
        if: matrix.core == '2026.11.1' && hashFiles('integrations/home-assistant/coverage-python.xml') != ''
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: integrations/home-assistant/coverage-python.xml
          if-no-files-found: error
          retention-days: 7

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: MEITHEAL_DB_URL=file:./.data/ci-migrations.db MEITHEAL_BOARD_GRANT_PATH=./.data/ci-migrations-grants.json pnpm --filter @meitheal/web db:migrate
      - run: MEITHEAL_DB_URL=file:./.data/ci-migrations.db MEITHEAL_BOARD_GRANT_PATH=./.data/ci-migrations-grants.json pnpm --filter @meitheal/web db:migrate:check

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/web schema:drift

  perf-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/web build
      - name: Guard — no absolute font paths in CSS
        run: |
          if grep -r 'url(/_astro/' apps/web/dist/client/_astro/*.css 2>/dev/null; then
            echo "::error::Absolute /_astro/ font paths found in CSS — will 404 behind HA ingress"
            exit 1
          fi
          echo "✅ No absolute font paths in CSS"
      - run: pnpm --filter @meitheal/web perf:budget

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependency advisories
        run: |
          production_paths=$(pnpm -r why --prod picomatch --json)
          jq -e 'type == "array"' <<< "$production_paths" >/dev/null
          ignore_status=0
          if [ "$(date -u +%s)" -lt "$(date -u -d 2026-11-24T00:00:00Z +%s)" ] &&
             jq -e 'length == 0' <<< "$production_paths" >/dev/null; then
            echo '::warning::Temporary build-only exception for GHSA-fc5q-39xc-vjpf expires 2026-11-24 UTC. See ADR 0023.'
            pnpm audit --ignore GHSA-fc5q-39xc-vjpf || ignore_status=$?
          fi
          # Print the complete advisory report even if the first audit failed.
          pnpm audit
          exit "$ignore_status"

  coverage-reporting:
    name: Report coverage (advisory)
    runs-on: ubuntu-latest
    needs: [typecheck-and-tests, ha-core]
    if: |
      !cancelled() &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.user.login != 'dependabot[bot]'))
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download TypeScript coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-ts
          path: .coverage-artifacts/ts
      - name: Download Home Assistant Python coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
          path: .coverage-artifacts/python
      - name: Report TypeScript coverage to Codecov
        if: env.CODECOV_TOKEN != '' && hashFiles('.coverage-artifacts/ts/lcov.info') != ''
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: .coverage-artifacts/ts/lcov.info
          flags: typescript
          disable_search: true
          fail_ci_if_error: true
      - name: Report Home Assistant Python coverage to Codecov
        if: env.CODECOV_TOKEN != '' && hashFiles('.coverage-artifacts/python/coverage-python.xml') != ''
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: .coverage-artifacts/python/coverage-python.xml
          flags: home-assistant
          disable_search: true
          fail_ci_if_error: true
      - name: Upload partial and final coverage reports to Codacy
        if: hashFiles('.coverage-artifacts/ts/lcov.info', '.coverage-artifacts/python/coverage-python.xml') != ''
        continue-on-error: true
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          COMMIT_UUID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "${CODACY_PROJECT_TOKEN:-}" ]; then
            echo "::notice::CODACY_PROJECT_TOKEN secret is not configured; skipping Codacy coverage upload."
            exit 0
          fi

          reporter_version="14.1.3"
          base_url="https://github.com/codacy/codacy-coverage-reporter/releases/download/${reporter_version}"
          tmp_dir=$(mktemp -d)
          trap 'rm -rf -- "$tmp_dir"' EXIT

          curl -fsSL "${base_url}/codacy-coverage-reporter-linux" -o "${tmp_dir}/codacy-coverage-reporter-linux"
          curl -fsSL "${base_url}/codacy-coverage-reporter-linux.SHA512SUM" -o "${tmp_dir}/codacy-coverage-reporter-linux.SHA512SUM"
          (cd "$tmp_dir" && sha512sum -c codacy-coverage-reporter-linux.SHA512SUM)
          chmod +x "${tmp_dir}/codacy-coverage-reporter-linux"

          uploaded=0
          if [ -s ".coverage-artifacts/ts/lcov.info" ]; then
            "${tmp_dir}/codacy-coverage-reporter-linux" report \
              --language TypeScript \
              --force-coverage-parser lcov \
              --coverage-reports ".coverage-artifacts/ts/lcov.info" \
              --commit-uuid "$COMMIT_UUID" \
              --partial
            uploaded=1
          fi

          if [ -s ".coverage-artifacts/python/coverage-python.xml" ]; then
            "${tmp_dir}/codacy-coverage-reporter-linux" report \
              --language Python \
              --force-coverage-parser cobertura \
              --coverage-reports ".coverage-artifacts/python/coverage-python.xml" \
              --prefix "integrations/home-assistant/" \
              --commit-uuid "$COMMIT_UUID" \
              --partial
            uploaded=1
          fi

          if [ "$uploaded" -eq 1 ]; then
            "${tmp_dir}/codacy-coverage-reporter-linux" final \
              --commit-uuid "$COMMIT_UUID"
          else
            echo "::warning::No coverage artifacts downloaded; skipping Codacy finalization."
          fi
