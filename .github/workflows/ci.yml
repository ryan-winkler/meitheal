name: CI

on:
  push:
    paths-ignore:
      - "meitheal-hub-canary/config.yaml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify required governance files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f AI_POLICY.md
          test -f .coderabbit.yaml
          test -f COMMERCIAL.md
          test -f LICENSE
          test -f NOTICE
          test ! -d apps/web/src/pages/api/v1
          test ! -d apps/api
          test -f WEBMCP.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SUPPORT.md
          test -f SECURITY.md
          test -f docs/index.md
          test -f docs/kcs/home-assistant-devcontainer.md
          test -f public/.well-known/mcp.json
          test -f public/.well-known/jsondoc.json
      - name: CSS brace balance check (all partials)
        run: |
          STATUS=0
          for CSS_FILE in apps/web/src/styles/*.css; do
            OPEN=$(grep -o '{' "$CSS_FILE" | wc -l)
            CLOSE=$(grep -o '}' "$CSS_FILE" | wc -l)
            if [ "$OPEN" -ne "$CLOSE" ]; then
              echo "::error file=$CSS_FILE::CSS brace imbalance: $OPEN opening vs $CLOSE closing braces"
              STATUS=1
            fi
          done
          if [ "$STATUS" -eq 0 ]; then
            echo "✅ CSS braces balanced across all partials"
          else
            exit 1
          fi
      - name: Version sync check (VER-02)
        run: node scripts/check-version-sync.mjs

  typecheck-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck domain packages
        run: |
          pnpm --filter @meitheal/domain-auth check
          pnpm --filter @meitheal/domain-observability check
          pnpm --filter @meitheal/domain-strategy check
          pnpm --filter @meitheal/domain-tasks check
          pnpm --filter @meitheal/integration-core check
          pnpm --filter @meitheal/tests check
      - name: Typecheck Astro pages and client code
        run: pnpm --filter @meitheal/web exec astro check
      - name: Build web app
        run: pnpm --filter @meitheal/web build
      - name: Keep internal context out of the web build
        run: |
          test ! -e apps/web/dist/client/llms.txt
          test ! -e apps/web/dist/client/llms-full.txt
      - run: pnpm --filter @meitheal/tests exec playwright install --with-deps --only-shell chromium
      - name: Test each spec with a fresh local server
        run: |
          test_tmp=$(mktemp -d)
          trap 'rm -rf -- "$test_tmp"' EXIT
          TMPDIR="$test_tmp" pnpm --filter @meitheal/tests test:ci

  ha-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/tests test e2e/ha-calendar-adapter.spec.ts
  ha-core:
    name: Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.10.4"
            requirements: requirements-test-2026.10.txt
          - core: "2026.11.0"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: integrations/home-assistant/${{ matrix.requirements }}
      - name: Test Core integration enrollment and actions
        working-directory: integrations/home-assistant
        env:
          TEST_REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m pip install -r "$TEST_REQUIREMENTS"
          python -m pytest -q

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: MEITHEAL_DB_URL=file:./.data/ci-migrations.db pnpm --filter @meitheal/web db:migrate
      - run: MEITHEAL_DB_URL=file:./.data/ci-migrations.db pnpm --filter @meitheal/web db:migrate:check

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/web schema:drift

  perf-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/web build
      - name: Guard — no absolute font paths in CSS
        run: |
          if grep -r 'url(/_astro/' apps/web/dist/client/_astro/*.css 2>/dev/null; then
            echo "::error::Absolute /_astro/ font paths found in CSS — will 404 behind HA ingress"
            exit 1
          fi
          echo "✅ No absolute font paths in CSS"
      - run: pnpm --filter @meitheal/web perf:budget

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
