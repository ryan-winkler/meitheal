name: CI

on:
  push:
    branches:
      - main
      - dev
      - release
    paths-ignore:
      - "meitheal-hub-canary/config.yaml"
      - "*.md"
      - ".planning/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - dev
      - release
    paths-ignore:
      - "*.md"
      - ".planning/**"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify required governance files
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f .coderabbit.yaml
          test -f COMMERCIAL.md
          test -f LICENSE
          test -f NOTICE
          test ! -d apps/web/src/pages/api/v1
          test ! -d apps/api
          test -f WEBMCP.md
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f SUPPORT.md
          test -f SECURITY.md
          test -f docs/index.md
          test -f docs/kcs/home-assistant-devcontainer.md
          test -f public/.well-known/mcp.json
          test -f public/.well-known/jsondoc.json
      - name: CSS brace balance check (all partials)
        run: |
          STATUS=0
          for CSS_FILE in apps/web/src/styles/*.css; do
            OPEN=$(grep -o '{' "$CSS_FILE" | wc -l)
            CLOSE=$(grep -o '}' "$CSS_FILE" | wc -l)
            if [ "$OPEN" -ne "$CLOSE" ]; then
              echo "::error file=$CSS_FILE::CSS brace imbalance: $OPEN opening vs $CLOSE closing braces"
              STATUS=1
            fi
          done
          if [ "$STATUS" -eq 0 ]; then
            echo "✅ CSS braces balanced across all partials"
          else
            exit 1
          fi
      - name: Version sync check (VER-02)
        run: node scripts/check-version-sync.mjs

  typecheck-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The isolated spec loop reached spec 211 of 215 at the 25-minute limit.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck domain packages
        run: |
          pnpm --filter @meitheal/domain-auth check
          pnpm --filter @meitheal/domain-observability check
          pnpm --filter @meitheal/domain-strategy check
          pnpm --filter @meitheal/domain-tasks check
          pnpm --filter @meitheal/integration-core check
          pnpm --filter @meitheal/tests check
      - name: Typecheck Astro pages and client code
        run: pnpm --filter @meitheal/web exec astro check
      - name: Build web app
        run: pnpm --filter @meitheal/web build
      - name: Keep internal context out of the web build
        run: |
          test ! -e apps/web/dist/client/llms.txt
          test ! -e apps/web/dist/client/llms-full.txt
      - name: Install the pinned Chromium on the hosted runner
        run: pnpm --filter @meitheal/tests exec playwright install chromium
      - name: Test each spec with a fresh local server
        env:
          MEITHEAL_COVERAGE_FILE: coverage/lcov.info
        run: |
          test_tmp=$(mktemp -d)
          trap 'rm -rf -- "$test_tmp"' EXIT
          TMPDIR="$test_tmp" pnpm --filter @meitheal/tests test:ci
      - name: Upload TypeScript coverage to Codecov
        if: always() && hashFiles('coverage/lcov.info') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: typescript
          disable_search: true
          fail_ci_if_error: true
      - name: Archive TypeScript coverage artifact
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ts
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  ha-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/tests test e2e/ha-calendar-adapter.spec.ts
  ha-core:
    name: Core ${{ matrix.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: "2026.10.4"
            requirements: requirements-test-2026.10.txt
          - core: "2026.11.1"
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the checked-out App for native protocol tests
        run: pnpm --filter @meitheal/web build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: integrations/home-assistant/${{ matrix.requirements }}
      - name: Test Core integration enrollment and actions
        working-directory: integrations/home-assistant
        env:
          TEST_REQUIREMENTS: ${{ matrix.requirements }}
          MEITHEAL_REQUIRE_APP_PROTOCOL: "1"
          HA_CORE_VERSION: ${{ matrix.core }}
        run: |
          python -m pip install -r "$TEST_REQUIREMENTS" pytest-cov
          if [ "$HA_CORE_VERSION" = "2026.11.1" ]; then
            python -m pytest -q --cov=custom_components.meitheal --cov-report=xml:coverage-python.xml --cov-report=term-missing:skip-covered
          else
            python -m pytest -q
          fi
      - name: Upload Home Assistant Python coverage to Codecov
        if: matrix.core == '2026.11.1' && hashFiles('integrations/home-assistant/coverage-python.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: integrations/home-assistant/coverage-python.xml
          flags: home-assistant
          disable_search: true
          fail_ci_if_error: true
      - name: Archive Home Assistant Python coverage artifact
        if: matrix.core == '2026.11.1' && hashFiles('integrations/home-assistant/coverage-python.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: integrations/home-assistant/coverage-python.xml
          if-no-files-found: error
          retention-days: 7

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: MEITHEAL_DB_URL=file:./.data/ci-migrations.db pnpm --filter @meitheal/web db:migrate
      - run: MEITHEAL_DB_URL=file:./.data/ci-migrations.db pnpm --filter @meitheal/web db:migrate:check

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/web schema:drift

  perf-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @meitheal/web build
      - name: Guard — no absolute font paths in CSS
        run: |
          if grep -r 'url(/_astro/' apps/web/dist/client/_astro/*.css 2>/dev/null; then
            echo "::error::Absolute /_astro/ font paths found in CSS — will 404 behind HA ingress"
            exit 1
          fi
          echo "✅ No absolute font paths in CSS"
      - run: pnpm --filter @meitheal/web perf:budget

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

  codacy-coverage:
    name: Upload coverage to Codacy
    runs-on: ubuntu-latest
    needs: [typecheck-and-tests, ha-core]
    if: always() && (needs.typecheck-and-tests.result == 'success' || needs.ha-core.result == 'success') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download TypeScript coverage artifact
        if: needs.typecheck-and-tests.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-ts
          path: .coverage-artifacts/ts
      - name: Download Home Assistant Python coverage artifact
        if: needs.ha-core.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
          path: .coverage-artifacts/python
      - name: Upload partial and final coverage reports to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          COMMIT_UUID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "${CODACY_PROJECT_TOKEN:-}" ]; then
            echo "::notice::CODACY_PROJECT_TOKEN secret is not configured; skipping Codacy coverage upload."
            exit 0
          fi

          reporter_version="14.1.3"
          base_url="https://github.com/codacy/codacy-coverage-reporter/releases/download/${reporter_version}"
          tmp_dir=$(mktemp -d)
          trap 'rm -rf -- "$tmp_dir"' EXIT

          curl -fsSL "${base_url}/codacy-coverage-reporter-linux" -o "${tmp_dir}/codacy-coverage-reporter-linux"
          curl -fsSL "${base_url}/codacy-coverage-reporter-linux.SHA512SUM" -o "${tmp_dir}/codacy-coverage-reporter-linux.SHA512SUM"
          (cd "$tmp_dir" && sha512sum -c codacy-coverage-reporter-linux.SHA512SUM)
          chmod +x "${tmp_dir}/codacy-coverage-reporter-linux"

          uploaded=0
          if [ -s ".coverage-artifacts/ts/lcov.info" ]; then
            "${tmp_dir}/codacy-coverage-reporter-linux" report \
              --language TypeScript \
              --force-coverage-parser lcov \
              --coverage-reports ".coverage-artifacts/ts/lcov.info" \
              --commit-uuid "$COMMIT_UUID" \
              --partial
            uploaded=1
          fi

          if [ -s ".coverage-artifacts/python/coverage-python.xml" ]; then
            "${tmp_dir}/codacy-coverage-reporter-linux" report \
              --language Python \
              --force-coverage-parser cobertura \
              --coverage-reports ".coverage-artifacts/python/coverage-python.xml" \
              --prefix "integrations/home-assistant/" \
              --commit-uuid "$COMMIT_UUID" \
              --partial
            uploaded=1
          fi

          if [ "$uploaded" -eq 1 ]; then
            "${tmp_dir}/codacy-coverage-reporter-linux" final \
              --commit-uuid "$COMMIT_UUID"
          else
            echo "::warning::No coverage artifacts downloaded; skipping Codacy finalization."
          fi
