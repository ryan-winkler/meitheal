name: App container smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "meitheal-hub/Dockerfile"
      - "meitheal-hub/toolchain/**"
      - "meitheal-hub/build.json"
      - "meitheal-hub-canary/build.json"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "apps/web/package.json"
      - "apps/web/tsconfig.json"
      - "packages/**/package.json"
      - "apps/web/astro.config.mjs"
      - "scripts/smoke-app-release-image.sh"
      - "scripts/check-app-release-image.sh"
      - ".github/workflows/container-smoke.yml"

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Packaged App (${{ matrix.channel }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, aarch64]
        channel: [meitheal-hub, meitheal-hub-canary]
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - architecture: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the packaged App without publishing
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          MANIFEST_DIR: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          version="${revision:0:12}"
          image="localhost/meitheal-ci:$version"
          base="$(jq -er --arg arch "$ARCHITECTURE" '.build_from[$arch]' "$MANIFEST_DIR/build.json")"
          docker build --platform "$PLATFORM" --file meitheal-hub/Dockerfile \
            --build-arg "BUILD_FROM=$base" --build-arg "MEITHEAL_VERSION=$version" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "io.hass.version=$version" --label "io.hass.arch=$ARCHITECTURE" \
            --tag "$image" .
          docker run --rm --network none --entrypoint node "$image" --input-type=module -e '
            import { readdirSync, readFileSync } from "node:fs"
            const assets = "/opt/meitheal/apps/web/dist/client/_astro"
            for (const name of readdirSync(assets, { recursive: true })) {
              if (!name.endsWith(".css")) continue
              if (/url\(\s*["\x27]?\/_astro\//.test(readFileSync(assets + "/" + name, "utf8"))) {
                console.error("Absolute font paths in packaged CSS break Home Assistant ingress:", name)
                process.exitCode = 1
              }
            }
          '
          bash scripts/smoke-app-release-image.sh docker "$image" "$revision" "$ARCHITECTURE" "$PLATFORM" "$version"
